name: Deploy Pipeline

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  deploy_job:
    runs-on: ubuntu-latest

    steps:
      # 1. 라벨 한 줄로 출력/정제
      - name: 📌 PR label 정보 출력
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          LABEL_NAMES=$(echo "$LABELS" | jq -r 'map(.name) | join(", ")')
          echo -n "📌 라벨 정보: "
          echo "$LABEL_NAMES"

          echo "LABEL_NAMES=$LABEL_NAMES" >> $GITHUB_ENV

      # 2. 라벨 없음 케이스 처리
      - name: ❗ 배포 라벨 없음
        if: ${{ env.LABEL_NAMES == '' }}
        run: |
          echo "ℹ️ 배포 관련 라벨이 없습니다. 실행을 스킵합니다."

      # 3. Node 환경 준비
      - name: 📦 Node 설치
        if: ${{ env.LABEL_NAMES != '' }}
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📥 패키지 설치
        if: ${{ env.LABEL_NAMES != '' }}
        run: yarn install

      # 4. CodePush 배포
      - name: 🚀 CodePush 배포 실행
        if: contains(env.LABEL_NAMES, 'Deploy:CodePush')
        run: |
          echo "🚀 CodePush 배포 실행"
          set -e
          yarn codepush-force

      # 5. Store 배포
      - name: 📦 Store 배포 실행
        if: contains(env.LABEL_NAMES, 'Deploy:Store')
        run: |
          echo "📦 Store 배포 실행"
          set -e
          yarn fastlane

      # 6. 실패 알림 (Slack)
      - name: ❌ Slack 배포 실패 알림
        if: failure() && env.LABEL_NAMES != ''
        run: |
          MESSAGE="🚨 *배포 실패!*  
          PR: #${{ github.event.pull_request.number }}  
          라벨: $LABEL_NAMES  
          담당자: ${{ github.event.pull_request.user.login }}  
          👉 상세 내용은 Actions 로그 확인"

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      # 7. 성공 알림 (Slack)
      - name: 🎉 Slack 배포 성공 알림
        if: success() && env.LABEL_NAMES != ''
        run: |
          MESSAGE="🎉 *배포 성공!*  
          PR: #${{ github.event.pull_request.number }}  
          라벨: $LABEL_NAMES  
          배포 완료되었습니다 👏"

          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}