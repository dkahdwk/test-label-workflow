name: Label Trigger Test

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  test_label_trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 📌 Print PR label names
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          echo "📌 라벨 정보:"
          echo "$LABELS" | jq -r '.[].name'
